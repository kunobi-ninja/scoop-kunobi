name: Excavator

on:
  workflow_dispatch:
  # Fired by a downstream repo's release pipeline (kache/kobe package-publish)
  # right after a release publishes, so manifests update immediately instead of
  # waiting for the schedule. One dispatch re-excavates every manifest; only the
  # one whose upstream version changed is committed (SKIP_UPDATED).
  repository_dispatch:
    types: [release]
  schedule:
    # run every 4 hours
    - cron: '20 */4 * * *'

permissions:
  contents: write

jobs:
  excavate:
    name: Excavate
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Excavate
        uses: ScoopInstaller/GithubActions@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_UPDATED: 1
